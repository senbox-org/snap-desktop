#
# Developers beware: this file is NOT used by our SNAP installer, it is only used in development mode!
# See org.esa.snap.nbexec.Launcher
#

# ${HOME} will be replaced by user home directory according to platform
default_userdir="${HOME}/.snap"

# options used by the launcher by default, can be overridden by explicit command line switches
# org.netbeans.JarClassLoader.limit_fd: max. number of JARs kept open. The NetBeans default (300) is below the
# number of JARs in SNAP, so JARs get closed and re-opened (re-reading their index) over and over at startup.
default_options="--branding ${branding.token} -J-Xms24m --locale en_GB -J-Dorg.netbeans.JarClassLoader.limit_fd=2048  -J-Dnetbeans.mainclass=org.esa.snap.main.Main -J-Dsun.java2d.noddraw=true -J-Dsun.awt.nopixfmt=true -J-Dsun.java2d.dpiaware=false -J-DTopSecurityManager.disable=true"
# for development purposes you may wish to append: -J-Dnetbeans.logger.console=true -J-ea

# default location of JDK/JRE, can be overridden by using --jdkhome <dir> switch (not used in development mode)
jdkhome="${env.JAVA_HOME}"

# clusters' paths separated by path.separator (semicolon on Windows, colon on Unix)
#extra_clusters=
